services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: trading-system
    env_file:
      - ../.env
    environment:
      DATABASE_URL: sqlite:////app/data/trading_system.db
      PERSISTENCE_DB_URL: sqlite:////app/data/trading_system_persistence.db
      HTTP_PORT: 8000
      DEPLOYMENT_MODE: docker-compose
    ports:
      - "8000:8000"
    volumes:
      - trading-system-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/readyz', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  trading-system-data:
